name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi
        
      - name: Build project
        run: npm run build
        
      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project jomakhoroch-60203
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
